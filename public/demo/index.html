<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Paridade Enotel — Demo</title>
  <link rel="stylesheet" href="/css/app.css">
  <!-- Anti-flash: aplica o tema salvo antes do primeiro paint (mesma chave do theme.js). -->
  <script>try{var m=localStorage.getItem('paridade.theme');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Demo 100% local: a unica chamada que nao passa pelo objeto `api` e o
    // download de CSV (fetch cru). Devolve um CSV de exemplo para o botao nao quebrar.
    (function () {
      var real = window.fetch.bind(window)
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url)
        if (url && url.indexOf('/api/report/csv') !== -1) {
          var csv = 'Canal,Entrada,Saida,Seu preco,Preco do canal,Diferenca\r\n' +
            'Trip.com,,,1320,832,-37%\r\nMaxMilhas,,,1090,959,-12%\r\n'
          return Promise.resolve(new Response('﻿' + csv, { status: 200, headers: { 'Content-Type': 'text/csv' } }))
        }
        return real(input, init)
      }
    })()
  </script>
</head>
<body>
  <div id="root">
    <div class="login-shell"><div class="spinner" style="width:26px;height:26px"></div></div>
  </div>
  <script type="module">
    import { api, setToken } from '/js/api.js'
    import { installDemo } from '/js/core/demo-fixtures.js'
    installDemo(api)          // troca os metodos de leitura por fixtures da Enotel
    setToken('demo-token')    // pula o login (boot ve o token + api.me mockado)
    await import('/js/app.js')// dinamico: boot() roda DEPOIS do installDemo
  </script>
</body>
</html>
